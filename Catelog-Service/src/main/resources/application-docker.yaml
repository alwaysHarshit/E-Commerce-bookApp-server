spring:
  application:
    name: catalog-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        ddl-auto: update

aws:
  access-key: ${SPRING_AWS_ACCESS_KEY}
  secret-key: ${SPRING_AWS_SECRET_KEY}
  bucket-name: ${SPRING_AWS_BUCKET_NAME}
  region: ${SPRING_AWS_REGION_NAME}

server:
  port: 8082
  servlet:
    context-path: /catalog-service

logging:
  level:
    org.booknest: debug
    root: error

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}
