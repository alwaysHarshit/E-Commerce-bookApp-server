spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**, /user/**

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/admin/**, /api/books/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
                allow-credentials: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

server:
  port: 8080