spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/catalog/**

server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8085/eureka
  instance:
    prefer-ip-address: true