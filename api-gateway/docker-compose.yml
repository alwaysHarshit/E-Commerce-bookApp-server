version: '3.0'

services:
  app:
    build: .
    image: ${DOCKER_USER}/api-gateway:${IMAGE_TAG}
    container_name: api-gateway
    ports:
      - "8080:8080"

    environment:
      EUREKA_URL: ${EUREKA_URL}

    restart: on-failure

    networks:
      - micro-net

networks:
  micro-net:
    external: true