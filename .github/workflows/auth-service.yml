name: Deploy Auth Service

on:
  push:
    branches:
      - feature/auth-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      #  Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      #  Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      #  Step 3: Build image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USER }}/auth-service:${{ github.sha }} ./Auth-Service

      #  Step 4: Push image
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USER }}/auth-service:${{ github.sha }}

      # Step 5: Copy docker-compose.yml to EC2 (ADD HERE)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "Auth-Service/docker-compose.yml"
          target: "/home/ubuntu/"

      #  Step 6: Deploy using docker-compose
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            mkdir -p /home/ubuntu
            cd /home/ubuntu/Auth-Service
            
            # create .env file
            cat <<EOF > .env
            DOCKER_USER=${{ secrets.DOCKER_USER }}
            IMAGE_TAG=${{ github.sha }}
            DB_URL=${{ secrets.USER_DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            EUREKA_URL=${{ secrets.EUREKA_URL }}
            GIT_CLIENT_ID=${{GIT_CLIENT_ID}}
            GIT_CLIENT_PASSWORD=${{GIT_CLIENT_PASSWORD}}
            EOF

            #  Stop old containers
            docker compose down || true

            #  Pull latest image
            docker compose pull

            #  Start new containers
            docker compose up -d