name: Deploy

on:
  push:
    branches:
      - feature/cart-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 📥 Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🐳 Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      # 🏗️ Step 3: Build image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USER }}/cart-service:${{ github.sha }} ./cart-service

      # 📤 Step 4: Push image
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USER }}/cart-service:${{ github.sha }}

      # 📁 ✅ Step 5: Copy docker-compose.yml to EC2 (ADD HERE)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "cart-service/docker-compose.yml"
          target: "/home/ubuntu/cart-service"

      # 🚀 Step 6: Deploy using docker-compose
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USER=${{ secrets.DOCKER_USER }}

            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASS="${{ secrets.DB_PASS }}"
            export EUREKA_URL="${{ secrets.EUREKA_URL }}"

            mkdir -p /home/ubuntu/cart-service
            cd /home/ubuntu/cart-service

            docker compose down || true
            docker compose pull
            docker compose up -d